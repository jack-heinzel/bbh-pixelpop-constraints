################################################################################
## O1-O4b BBH collection at FAR < 1/yr (IFAR > 1 yr): the O4b population paper's
## August-rerun set (o4b_population/pixelpop-o4/code/collection/
## collect_o4b_chieff_chip.ini), 259 events. Same files, ignore list, preferred
## labels, VT and thresholds; see catalogs.py.
##
## Collect with:  bash run_collect.sh  (dry_run.py, collect.py, check_labels.py).
##
## Variable NPE: collect.py (pixelpop's collector) keeps every event at its own
## sample count up to samples-per-posterior, padding short events with
## prior = +inf rows, instead of downsampling all to the smallest event (1993 in
## the reference). Cap 20000 (user, 2026-10-20), as the reference ini.
##
## preferred-labels resolves each file's label (catalogs.PREFERRED_LABELS, the
## reference's list); collect.py passes them per event with only_listed_events=True.
################################################################################

run-dir=/home/jack.heinzel/public_html/bbh-pixelpop-constraints/data/gwtc5_ifar1_chieffchip
vt-file=/home/rp.o4/offline-injections/mixtures/multirun-mixtures_20260410130052UTC_corrected/mixture-semi_o1_o2-real_o3_o4a_o4b-cartesian_spins_20260410130052UTC-clipped.hdf
vt-ifar-threshold=1.0
vt-snr-threshold=10.0
backend=numpy
cosmology=Planck15_LAL

################################################################################
## Data collection arguments
################################################################################

parameters=[mass_1, mass_ratio, redshift, chi_eff, chi_p]
ignore=[GW170817, S190425z, GW200115, 190403, 230518, GW191204_110529, GW200208_222617, 230529, GW190425_081805, 190426, 190514, GW190814, 190916, GW190917, 190926, 191113, 191126, GW191219, 200105, 200115, 200210, 200220, 200306, 200308, 200322]
sample-regex={
    GWTC2.1: /home/rp.o4/catalogs/GWTC-2.1/data-release/*_cosmo.h5,
    GWTC3: /home/rp.o4/catalogs/GWTC-3/data-release/IGWN-GWTC3p0-v1-GW*_cosmo.h5,
    GWTC4: /home/rp.o4/catalogs/GWTC-4p1/GWTC4p1-Stable_Release-3/18965dda8_5/bbh_only/*.hdf5,
    GWTC5: /home/rp.o4/catalogs/GWTC-5/GWTC5-Stable_Release-8/4c51f4201_25/bbh_only/*.hdf5,
    }
preferred-labels=[C00:NRSur7dq4, C00:Mixed, C00:IMRPhenomXPHM-SpinTaylor, C01:NRSur7dq4, C01:Mixed, C01:IMRPhenomXPHM-SpinTaylor]
plot=True
samples-per-posterior=20000
collection-seed=None
data-label=posteriors
distance-prior=comoving
mass-prior=flat-detector-components
spin-prior=component
custom-parameter-mapping=None
